# Generated by celestia-wallpaper (matugen).
set -g status-style 'fg={{colors.primary.dark.hex}}'
set -g pane-border-style 'fg={{colors.outline_variant.dark.hex}}'
set -g pane-active-border-style 'fg={{colors.primary.dark.hex}}'
setw -g mode-style 'fg={{colors.on_primary_container.dark.hex}} bg={{colors.primary_container.dark.hex}} bold'
setw -g clock-mode-colour '{{colors.primary.dark.hex}}'
set -g message-style 'fg={{colors.on_secondary_container.dark.hex}} bg={{colors.secondary_container.dark.hex}}'
setw -g window-status-current-style 'fg={{colors.on_primary.dark.hex}} bg={{colors.primary.dark.hex}} bold'
setw -g window-status-style 'fg={{colors.on_surface_variant.dark.hex}}'
setw -g window-status-format '#[fg={{colors.tertiary.dark.hex}},bold] #I #[fg={{colors.on_surface_variant.dark.hex}},nobold]#W #F '
setw -g window-status-current-format '#[fg={{colors.on_tertiary.dark.hex}},bg={{colors.tertiary.dark.hex}},bold] #I #[fg={{colors.on_primary.dark.hex}},bg={{colors.primary.dark.hex}}] #W #F '
